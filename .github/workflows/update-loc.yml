# Automatically updates the Lines of Code badge in README.md whenever commits
# are pushed to GitHub (either directly to this repo or dispatched by git push).
name: Update Lines of Code

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [push]

permissions:
  contents: write

concurrency:
  group: update-loc
  cancel-in-progress: true

jobs:
  update-loc:
    if: github.event_name != 'push' || github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recalculate lines of code across all repositories
        env:
          LOC_TOKEN: ${{ secrets.LOC_TOKEN || github.token }}
        run: python3 .github/scripts/update_loc.py

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898183+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "Update lines of code count in README"
          git pull --rebase
          git push
